<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

<meta name="theme-color" content="#2563eb" />

<meta name="mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CivicConnect</title>
    <script>
      // Apply the saved theme before the first paint so dark mode users do not
      // see a white flash on reload. Keep the key in sync with THEME_STORAGE_KEY
      // in src/utils/theme.js.
      (function () {
        try {
          var saved = localStorage.getItem('civic-theme');
          var root = document.documentElement;
          if (saved === 'warm-civic') {
            root.classList.add('theme-warm-civic');
            root.dataset.theme = 'warm-civic';
          } else if (saved === 'high-contrast') {
            root.classList.add('dark', 'theme-high-contrast');
            root.dataset.theme = 'high-contrast';
          } else {
            var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) root.classList.add('dark');
            root.dataset.theme = dark ? 'dark' : 'light';
          }
        } catch (e) { }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
